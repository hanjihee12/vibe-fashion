{% extends "base.html" %}

{% block title %}새 비밀번호 설정 - {{ mall_name|default('VIBE-FASHION') }}{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-dark text-white p-3 mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-shield-lock-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">새 비밀번호 설정</h3>
                    <p class="text-secondary small mb-0">새로운 비밀번호를 입력해주세요.</p>
                </div>

                <div class="bg-light rounded-3 p-3 mb-4 text-center small">
                    <span class="text-muted">대상 계정:</span>
                    <strong class="text-dark ms-1">{{ email }}</strong>
                </div>

                {% if error_message %}
                <div class="alert alert-danger alert-dismissible fade show rounded-3 small mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-1"></i>{{ error_message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
                {% endif %}

                <!-- 새 비밀번호 입력 폼 -->
                <form method="POST" action="{{ url_for('auth.reset_password') }}">
                    <input type="hidden" name="token" value="{{ token }}">

                    <div class="mb-3">
                        <label for="newPassword" class="form-label small fw-semibold text-secondary">새 비밀번호</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="newPassword" name="new_password" placeholder="새 비밀번호 (4자리 이상)" required autofocus>
                        </div>
                        <div class="form-text small text-muted">비밀번호는 최소 4자리 이상이어야 합니다.</div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label small fw-semibold text-secondary">새 비밀번호 확인</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="confirmPassword" name="confirm_password" placeholder="새 비밀번호를 한 번 더 입력하세요" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 py-2.5 rounded-pill fw-bold shadow-sm mb-3">
                        <i class="bi bi-check2-circle me-1"></i>비밀번호 변경 완료
                    </button>

                    <div class="text-center small">
                        <a href="{{ url_for('auth.login') }}" class="text-secondary text-decoration-none">
                            <i class="bi bi-arrow-left me-1"></i>로그인으로 돌아가기
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
