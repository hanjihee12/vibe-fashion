<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VIBE-FASHION 관리자 센터{% endblock %}</title>
    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
        }
        .admin-sidebar {
            min-height: 100vh;
            background-color: #212529;
            color: #fff;
        }
        .admin-sidebar .nav-link {
            color: rgba(255, 255, 255, 0.75);
            padding: 0.75rem 1.25rem;
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }
        .admin-sidebar .nav-link:hover, .admin-sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }
        .admin-header {
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
        }
        .card {
            border: 0;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- 관리자 사이드바 -->
            <nav class="col-md-3 col-lg-2 d-md-block admin-sidebar collapse px-3 py-4">
                <div class="d-flex align-items-center mb-4 px-2">
                    <i class="bi bi-shield-lock-fill text-danger fs-4 me-2"></i>
                    <span class="fs-5 fw-bold text-white tracking-wide">ADMIN CENTER</span>
                </div>
                <div class="small text-muted text-uppercase px-2 mb-2">메뉴</div>
                <ul class="nav flex-column mb-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path in ['/admin', '/admin/', '/admin/dashboard'] %}active{% endif %}" href="{{ url_for('admin.dashboard') }}">
                            <i class="bi bi-speedometer2 me-2"></i>대시보드
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/admin/orders' in request.path %}active{% endif %}" href="{{ url_for('admin.orders') }}">
                            <i class="bi bi-box-seam me-2"></i>주문 관리
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/admin/products' in request.path %}active{% endif %}" href="{{ url_for('admin.products') }}">
                            <i class="bi bi-tags me-2"></i>상품 / 재고
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/admin/users' in request.path %}active{% endif %}" href="{{ url_for('admin.users') }}">
                            <i class="bi bi-people me-2"></i>회원 관리
                        </a>
                    </li>
                </ul>

                <hr class="text-white-50 my-4">

                <div class="px-2">
                    <div class="small text-white-50 mb-1">접속 관리자: <strong>{{ session.get('admin_user', 'admin') }}</strong></div>
                    <div class="d-flex gap-2 mt-3">
                        <a href="{{ url_for('main.index') }}" target="_blank" class="btn btn-outline-light btn-sm w-50">
                            <i class="bi bi-shop me-1"></i>쇼핑몰
                        </a>
                        <a href="{{ url_for('admin.logout') }}" class="btn btn-danger btn-sm w-50">
                            <i class="bi bi-box-arrow-right me-1"></i>로그아웃
                        </a>
                    </div>
                </div>
            </nav>

            <!-- 본문 영역 -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
