{% extends "base.html" %}

{% block title %}비밀번호 변경 완료 - {{ mall_name|default('VIBE-FASHION') }}{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center p-4 p-md-5 bg-white">
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-success-subtle text-success p-4 mb-3" style="width: 88px; height: 88px;">
                        <i class="bi bi-shield-check" style="font-size: 3rem;"></i>
                    </div>
                    <h2 class="fw-bold mb-2">비밀번호 변경 완료!</h2>
                    <p class="text-secondary small mb-0">새로운 비밀번호가 안전하게 설정되었습니다.<br>새로운 비밀번호로 로그인해주세요.</p>
                </div>

                <div class="bg-light rounded-3 p-3 mb-4 text-center small">
                    <span class="text-muted">계정:</span>
                    <strong class="text-dark ms-1">{{ email }}</strong>
                </div>

                <div class="alert alert-primary py-2 px-3 small rounded-3 mb-4 d-flex align-items-center justify-content-center gap-2">
                    <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
                    <span><strong id="countdown">3</strong>초 후 로그인 페이지로 자동 이동합니다...</span>
                </div>

                <a href="{{ url_for('auth.login') }}" class="btn btn-dark w-100 py-2.5 rounded-pill fw-bold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i>지금 로그인하기
                </a>
            </div>
        </div>
    </div>
</div>

<script>
let count = 3;
const countdownEl = document.getElementById('countdown');
const timer = setInterval(() => {
    count--;
    if (countdownEl) countdownEl.textContent = count;
    if (count <= 0) {
        clearInterval(timer);
        window.location.href = "{{ url_for('auth.login') }}";
    }
}, 1000);
</script>
{% endblock %}
