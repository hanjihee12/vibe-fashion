{% extends "base.html" %}

{% block title %}{{ error_title|default('인증 오류') }} - {{ mall_name|default('VIBE-FASHION') }}{% endblock %}

{% block content %}
<div class="container py-5 my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden text-center p-4 p-md-5">
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger-subtle text-danger p-4 mb-3" style="width: 88px; height: 88px;">
                        <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
                    </div>
                    <h3 class="fw-bold mb-2">{{ error_title|default('인증에 실패했습니다') }}</h3>
                    <p class="text-secondary small">{{ error_message|default('유효하지 않거나 만료된 링크입니다.') }}</p>
                </div>

                <div class="d-flex flex-column gap-2">
                    <button type="button" class="btn btn-dark w-100 py-2 rounded-pill fw-bold" onclick="window.location.href='/';">
                        <i class="bi bi-house-door me-1"></i>홈으로 이동
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
