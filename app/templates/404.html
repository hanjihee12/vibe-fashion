{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없습니다 | VIBE-FASHION{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
    <div class="py-5">
        <i class="bi bi-exclamation-circle display-1 text-danger"></i>
        <h1 class="display-4 fw-bold mt-3">404 - Not Found</h1>
        <p class="lead text-secondary">{{ message|default('요청하신 페이지가 존재하지 않습니다.') }}</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-dark rounded-pill px-4 py-2 mt-3">
            <i class="bi bi-house me-1"></i>홈으로 돌아가기
        </a>
    </div>
</div>
{% endblock %}
