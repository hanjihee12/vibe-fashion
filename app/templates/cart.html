{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <!-- 페이지 제목 -->
    <div class="row mb-4">
        <div class="col">
            <h2 class="mb-0">
                <i class="bi bi-bag"></i> 장바구니
            </h2>
        </div>
    </div>

    <!-- 로그인 여부 확인 메시지 -->
    <div id="loginCheckDiv" class="alert alert-info" role="alert">
        <span id="loginCheckMsg">장바구니를 불러오는 중입니다...</span>
        <a href="/auth/login" class="float-end">로그인하기</a>
    </div>

    <!-- 장바구니 컨텐츠 (초기 숨김) -->
    <div id="cartContent" style="display: none;">
        <!-- 장바구니 아이템 테이블 -->
        <div class="row mb-4">
            <div class="col-lg-8">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 60px;"></th>
                                <th>상품명</th>
                                <th style="width: 100px;">색상/사이즈</th>
                                <th style="width: 100px;">단가</th>
                                <th style="width: 120px;">수량</th>
                                <th style="width: 100px;">소계</th>
                                <th style="width: 50px;"></th>
                            </tr>
                        </thead>
                        <tbody id="cartItemsTable">
                            <!-- JavaScript로 동적 추가 -->
                        </tbody>
                    </table>
                </div>

                <!-- 장바구니 비어있음 메시지 -->
                <div id="emptyCartMsg" class="alert alert-warning text-center py-5" style="display: none;">
                    <i class="bi bi-bag-x" style="font-size: 3rem; color: #999;"></i>
                    <p class="mt-3 mb-0">장바구니가 비어있습니다.</p>
                    <a href="/" class="btn btn-sm btn-outline-primary mt-3">쇼핑 계속하기</a>
                </div>
            </div>

            <!-- 주문 요약 -->
            <div class="col-lg-4">
                <div class="card sticky-top" style="top: 80px;">
                    <div class="card-body">
                        <h5 class="card-title mb-4">주문 요약</h5>

                        <div class="row mb-3">
                            <div class="col">
                                <span class="text-muted">상품 금액</span>
                            </div>
                            <div class="col text-end">
                                <span id="summarySubtotal" class="fw-bold">0원</span>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col">
                                <span class="text-muted">배송료</span>
                            </div>
                            <div class="col text-end">
                                <span id="summaryShipping" class="fw-bold">무료</span>
                            </div>
                        </div>

                        <hr>

                        <div class="row mb-4">
                            <div class="col">
                                <h6>총주문액</h6>
                            </div>
                            <div class="col text-end">
                                <h5 class="mb-0" id="summaryTotal" style="color: #e74c3c;">0원</h5>
                            </div>
                        </div>

                        <button id="checkoutBtn" class="btn btn-primary w-100 mb-2" disabled>
                            <i class="bi bi-credit-card"></i> 결제하기
                        </button>
                        <a href="/" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-arrow-left"></i> 쇼핑 계속하기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 수량 변경 토스트 -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="updateToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto">알림</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="toast-body" id="updateToastBody">
            수량이 변경되었습니다.
        </div>
    </div>
</div>

<style>
    .quantity-control {
        display: flex;
        align-items: center;
        gap: 5px;
    }
    .quantity-btn {
        width: 30px;
        height: 30px;
        padding: 0;
        font-size: 12px;
    }
    .quantity-input {
        width: 50px;
        text-align: center;
        font-weight: bold;
    }
    .cart-item-row {
        transition: background-color 0.3s ease;
    }
    .cart-item-row.updating {
        opacity: 0.6;
    }
    .price-text {
        font-weight: 500;
        color: #2c3e50;
    }
    .product-image {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 4px;
    }
</style>

<script>
    const CART_API_URL = '/api/cart';
    const CART_UPDATE_URL = '/cart';

    let cartData = {
        items: [],
        total_quantity: 0,
        total_price: 0,
        item_count: 0
    };

    // 페이지 로드 시 장바구니 데이터 조회
    document.addEventListener('DOMContentLoaded', function() {
        loadCartItems();
    });

    function loadCartItems() {
        const loginCheckDiv = document.getElementById('loginCheckDiv');
        const cartContent = document.getElementById('cartContent');
        const loginCheckMsg = document.getElementById('loginCheckMsg');

        fetch(CART_API_URL)
            .then(res => {
                if (res.status === 401) {
                    // 비로그인
                    loginCheckMsg.textContent = '로그인이 필요합니다. 로그인 페이지로 이동해주세요.';
                    loginCheckDiv.classList.remove('alert-info');
                    loginCheckDiv.classList.add('alert-warning');
                    cartContent.style.display = 'none';
                    return Promise.reject('not_logged_in');
                }
                return res.json();
            })
            .then(data => {
                if (!data.success) {
                    alert('장바구니 데이터를 불러오지 못했습니다: ' + (data.message || '알 수 없는 오류'));
                    return;
                }

                cartData = data;
                loginCheckDiv.style.display = 'none';
                cartContent.style.display = 'block';

                renderCartItems();
                updateSummary();
            })
            .catch(err => {
                if (err !== 'not_logged_in') {
                    console.error('Error loading cart:', err);
                }
            });
    }

    function renderCartItems() {
        const itemsTable = document.getElementById('cartItemsTable');
        const emptyMsg = document.getElementById('emptyCartMsg');

        itemsTable.innerHTML = '';

        if (!cartData.items || cartData.items.length === 0) {
            emptyMsg.style.display = 'block';
            return;
        } else {
            emptyMsg.style.display = 'none';
        }

        cartData.items.forEach(item => {
            const row = createCartItemRow(item);
            itemsTable.appendChild(row);
        });
    }

    function createCartItemRow(item) {
        const tr = document.createElement('tr');
        tr.id = `cart-item-${item.id}`;
        tr.className = 'cart-item-row';

        const pricePerUnit = item.unit_price;
        const subtotal = item.subtotal;

        tr.innerHTML = `
            <td>
                <img src="${item.image}" alt="${item.product_name}" class="product-image" 
                     onerror="this.src='https://via.placeholder.com/60?text=No+Image'">
            </td>
            <td>
                <div class="fw-bold">${escapeHtml(item.product_name)}</div>
                <small class="text-muted">옵션ID: ${item.option_id.substring(0, 8)}...</small>
            </td>
            <td>
                <div>${escapeHtml(item.color)}</div>
                <div class="text-muted small">${escapeHtml(item.size)}</div>
            </td>
            <td>
                <span class="price-text">${formatPrice(pricePerUnit)}</span>
            </td>
            <td>
                <div class="quantity-control">
                    <button class="btn btn-sm btn-outline-secondary quantity-btn" 
                            onclick="changeQuantity('${item.id}', ${Math.max(1, item.quantity - 1)}, this)">−</button>
                    <input type="number" class="form-control quantity-input" value="${item.quantity}" 
                           min="1" max="${item.stock}" 
                           onchange="changeQuantity('${item.id}', parseInt(this.value), this)"
                           data-max="${item.stock}">
                    <button class="btn btn-sm btn-outline-secondary quantity-btn" 
                            onclick="changeQuantity('${item.id}', ${item.quantity + 1}, this)">+</button>
                </div>
            </td>
            <td>
                <span class="price-text" id="subtotal-${item.id}">${formatPrice(subtotal)}</span>
            </td>
            <td>
                <button class="btn btn-sm btn-outline-danger" onclick="removeCartItem('${item.id}')">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        `;

        return tr;
    }

    function changeQuantity(cartId, newQuantity, triggerElement) {
        // 1. 유효성 검증
        const cartRow = document.getElementById(`cart-item-${cartId}`);
        const inputElement = cartRow.querySelector('.quantity-input');
        const maxStock = parseInt(inputElement.getAttribute('data-max'));
        const currentQuantity = parseInt(inputElement.value);

        // 수량 범위 체크
        if (newQuantity < 1) {
            inputElement.value = 1;
            return;
        }

        if (newQuantity > maxStock) {
            alert(`최대 ${maxStock}개까지만 주문 가능합니다.`);
            inputElement.value = currentQuantity;
            return;
        }

        // 변경 안 된 경우 무시
        if (newQuantity === currentQuantity) {
            return;
        }

        // 2. UI 업데이트 (진행 중 표시)
        cartRow.classList.add('updating');
        triggerElement.disabled = true;

        // 3. PATCH 요청
        fetch(`${CART_UPDATE_URL}/${cartId}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ quantity: newQuantity })
        })
            .then(res => res.json())
            .then(data => {
                if (!data.success) {
                    alert('오류: ' + (data.message || '수량 변경 실패'));
                    inputElement.value = currentQuantity;
                    return;
                }

                // 성공: 로컬 데이터 업데이트
                const cartItem = cartData.items.find(item => item.id === cartId);
                if (cartItem) {
                    cartItem.quantity = data.quantity;
                    cartItem.subtotal = data.subtotal;
                    cartItem.unit_price = data.unit_price;

                    // UI 갱신
                    document.getElementById(`subtotal-${cartId}`).textContent = formatPrice(data.subtotal);
                    inputElement.value = data.quantity;
                    updateSummary();
                    showUpdateToast(`${cartItem.product_name} 수량이 ${data.quantity}개로 변경되었습니다.`);
                }
            })
            .catch(err => {
                console.error('Error updating quantity:', err);
                alert('수량 변경 중 오류가 발생했습니다.');
                inputElement.value = currentQuantity;
            })
            .finally(() => {
                cartRow.classList.remove('updating');
                triggerElement.disabled = false;
            });
    }

    function removeCartItem(cartId) {
        if (!confirm('이 항목을 장바구니에서 제거하시겠습니까?')) {
            return;
        }

        // quantity를 0으로 설정하여 삭제 (또는 DELETE 엔드포인트 필요)
        // 현재는 간단히 로컬에서 제거
        const cartRow = document.getElementById(`cart-item-${cartId}`);
        cartRow.style.opacity = '0.5';

        // 로컬 데이터에서 제거
        cartData.items = cartData.items.filter(item => item.id !== cartId);
        cartRow.remove();

        updateSummary();

        if (cartData.items.length === 0) {
            document.getElementById('emptyCartMsg').style.display = 'block';
            document.querySelector('.table-responsive').style.display = 'none';
        }

        showUpdateToast('항목이 제거되었습니다.');
    }

    function updateSummary() {
        const totalPrice = cartData.items.reduce((sum, item) => sum + item.subtotal, 0);
        const totalQuantity = cartData.items.reduce((sum, item) => sum + item.quantity, 0);

        document.getElementById('summarySubtotal').textContent = formatPrice(totalPrice);
        document.getElementById('summaryTotal').textContent = formatPrice(totalPrice);

        const checkoutBtn = document.getElementById('checkoutBtn');
        if (cartData.items.length > 0) {
            checkoutBtn.disabled = false;
        } else {
            checkoutBtn.disabled = true;
        }

        // 헤더의 장바구니 카운트 업데이트 (base.html에 cart-count ID가 있으면)
        const cartCountElement = document.getElementById('cart-count');
        if (cartCountElement) {
            cartCountElement.textContent = totalQuantity;
        }
    }

    function showUpdateToast(message) {
        const toastBody = document.getElementById('updateToastBody');
        toastBody.textContent = message;

        const toastElement = document.getElementById('updateToast');
        const toast = new bootstrap.Toast(toastElement, { delay: 2000 });
        toast.show();
    }

    function formatPrice(price) {
        if (typeof price === 'string') {
            price = parseInt(price);
        }
        return (price || 0).toLocaleString('ko-KR') + '원';
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 결제하기 버튼 이벤트
    document.addEventListener('DOMContentLoaded', function() {
        const checkoutBtn = document.getElementById('checkoutBtn');
        if (checkoutBtn) {
            checkoutBtn.addEventListener('click', function() {
                if (cartData.items.length === 0) {
                    alert('장바구니가 비어있습니다.');
                    return;
                }
                alert('결제 페이지는 준비 중입니다.');
                // 나중에 실제 결제 페이지로 이동
            });
        }
    });
</script>
{% endblock %}
